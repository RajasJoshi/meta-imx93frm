local_conf_header:
  nxp-eula: |
    ACCEPT_FSL_EULA = "1"
  debug-tweaks: |
    IMAGE_FEATURES += "empty-root-password allow-empty-password allow-root-login post-install-logging"
    INHERIT += "rm_work"
    INIT_MANAGER = "systemd"
  swupdate: |
    WKS_FILE = "dual-imx-boot-bootpart.wks.in"
    BOOT_PARTITION_SIZE_MIB   ?= "128"
    ROOTFS_PARTITION_SIZE_MIB ?= "1024"
    DATA_PARTITION_SIZE_MIB   ?= "512"
